name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifests and SemVer
        run: python3 scripts/validate_plugins.py

      - name: Run plugin validator tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
